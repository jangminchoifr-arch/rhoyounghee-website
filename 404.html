<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — 동화작가 노영희</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#fffefb;--grid:rgba(110,160,120,.11);--ink:#2b2d2c;--soft:#6d716e;--line:#d9dcd6;--blue:#2f7fb5}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:var(--ink);font:16px/1.8 "Noto Sans KR",system-ui,sans-serif;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
main{max-width:460px;text-align:center;background:rgba(255,254,251,.92);border:1px solid var(--line);padding:40px 32px;box-shadow:6px 8px 0 rgba(110,160,120,.08)}
img{height:58px;width:auto;margin:0 auto 18px;display:block}
h1{font-family:"Gowun Batang",serif;font-size:26px;font-weight:700;margin:0 0 10px}
p{margin:0 0 22px;color:var(--soft);font-size:15px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border:1px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-size:15px}
a:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<main>
<img src="/SIG21_website_header.svg" alt="동화작가 노영희">
<h1>찾으시는 페이지가 없습니다</h1>
<p>주소가 바뀌었거나 잘못 입력되었습니다. 동화작가 노영희 공식 홈으로 돌아가실 수 있습니다.</p>
<a href="/">홈으로 돌아가기</a>
</main>
</body>
</html>
